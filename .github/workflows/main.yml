name: Node.JS CI/CD with Docker on Render

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test (unit + e2e)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Run core coverage (>= 70%)
        run: npm run test:cov:core

      - name: Upload core coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: coverage-core

  build-push-deploy:
    name: Build Docker & Deploy
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/share-in:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deploy
        if: success() # Chỉ chạy nếu bước trên thành công
        run: |
          curl -X GET "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"      